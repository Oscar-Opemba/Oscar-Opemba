<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oscar Opemba — 3D Contribution Skyline</title>
<meta name="description" content="Interactive 3D visualization of Oscar Opemba's GitHub contribution graph.">
<style>
  :root {
    color-scheme: dark;
    --bg: #08090d;
    --panel: rgba(18, 22, 30, 0.55);
    --stroke: rgba(255, 255, 255, 0.08);
    --stroke-hi: rgba(57, 211, 83, 0.55);
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #39d353;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* Ambient depth: a soft green glow behind the scene + a vignette on top */
  #app::before {
    content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(60% 55% at 50% 62%, rgba(35, 134, 54, 0.16), transparent 70%),
      radial-gradient(100% 100% at 50% 0%, rgba(88, 166, 255, 0.05), transparent 55%);
  }
  #app::after {
    content: ""; position: fixed; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(130% 130% at 50% 48%, transparent 68%, rgba(0,0,0,0.38) 100%);
  }

  .hud { position: fixed; pointer-events: none; z-index: 10; }
  #title { top: 22px; left: 26px; }
  #title h1 {
    font-size: 20px; font-weight: 700; letter-spacing: -0.2px;
    background: linear-gradient(90deg, #e6edf3, #7ee787);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #title p { font-size: 13px; color: var(--muted); margin-top: 3px; }
  #title .total {
    color: var(--accent); font-weight: 700;
    text-shadow: 0 0 18px rgba(57, 211, 83, 0.55);
  }

  #legend {
    bottom: 22px; left: 26px;
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--stroke);
    padding: 9px 13px; border-radius: 12px;
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
  }
  #legend .cells { display: flex; gap: 3px; }
  #legend .cell { width: 12px; height: 12px; border-radius: 3px; }

  #hint {
    bottom: 24px; right: 26px;
    font-size: 12px; color: #6e7681; text-align: right; line-height: 1.7;
  }
  #hint kbd {
    font-family: inherit; background: rgba(255,255,255,0.06); border: 1px solid var(--stroke);
    border-radius: 5px; padding: 1px 6px; color: #b1bac4; font-size: 11px;
  }

  .btns { position: fixed; top: 20px; right: 22px; z-index: 10; display: flex; gap: 9px; }
  .btns button {
    pointer-events: auto; cursor: pointer;
    background: var(--panel); border: 1px solid var(--stroke); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 500; padding: 8px 15px; border-radius: 10px;
    backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2);
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    transition: border-color .18s ease, background .18s ease, transform .18s ease;
  }
  .btns button:hover {
    border-color: var(--stroke-hi);
    background: rgba(35, 134, 54, 0.16);
    transform: translateY(-1px);
  }
  .btns button:active { transform: translateY(0); }

  #status {
    position: fixed; inset: 0; z-index: 20; display: flex;
    align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    background: var(--bg); text-align: center; padding: 24px;
    transition: opacity .5s ease;
  }
  #status .spinner {
    width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.08); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 1s linear infinite;
    box-shadow: 0 0 24px rgba(57,211,83,0.35);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #status p { color: var(--muted); font-size: 14px; }
  #status a { color: #58a6ff; text-decoration: none; }
  #status a:hover { text-decoration: underline; }
  .hidden { opacity: 0 !important; pointer-events: none !important; }

  @media (max-width: 640px) {
    #hint { display: none; }
    #title h1 { font-size: 17px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="title" class="hud">
  <h1>Oscar Opemba</h1>
  <p><span class="total" id="total">…</span> contributions in the last year</p>
</div>

<div class="btns">
  <button id="toggleRotate">Pause rotation</button>
  <button id="resetView">Reset view</button>
</div>

<div id="legend" class="hud">
  <span>Less</span>
  <div class="cells" id="legendCells"></div>
  <span>More</span>
</div>

<div id="hint" class="hud">
  <div><kbd>drag</kbd> rotate &nbsp; <kbd>scroll</kbd> zoom &nbsp; <kbd>right-drag</kbd> pan</div>
</div>

<div id="status">
  <div class="spinner"></div>
  <p>Loading contribution data…</p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const USERNAME = 'Oscar-Opemba';
const API = `https://github-contributions-api.jogruber.de/v4/${USERNAME}?y=last`;

// GitHub's dark-mode contribution palette (level 0-4)
const LEVEL_COLORS = ['#161b22', '#0e4429', '#006d32', '#26a641', '#39d353'];

const statusEl = document.getElementById('status');
const totalEl = document.getElementById('total');

// Build legend swatches
const legendCells = document.getElementById('legendCells');
LEVEL_COLORS.forEach(c => {
  const d = document.createElement('div');
  d.className = 'cell';
  d.style.background = c;
  legendCells.appendChild(d);
});

// ---- Scene setup ----
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1117');
scene.fog = new THREE.Fog('#0d1117', 60, 160);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(38, 34, 46);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.45;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 20;
controls.maxDistance = 130;
controls.maxPolarAngle = Math.PI / 2.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.7;

// ---- Lighting ----
scene.add(new THREE.AmbientLight(0xffffff, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 1.25);
key.position.set(30, 60, 25);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -70; key.shadow.camera.right = 70;
key.shadow.camera.top = 70; key.shadow.camera.bottom = -70;
key.shadow.camera.far = 200;
scene.add(key);
const rim = new THREE.DirectionalLight(0x39d353, 0.25);
rim.position.set(-30, 20, -30);
scene.add(rim);

const world = new THREE.Group();
scene.add(world);

// ---- Post-processing: subtle bloom so the lit cells actually glow ----
// Guarded — if the addon pipeline fails to init, we fall back to direct render.
let composer = null;
try {
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  const bloom = new UnrealBloomPass(
    new THREE.Vector2(innerWidth, innerHeight),
    0.5,   // strength — restrained, only the bright greens bloom
    0.6,   // radius
    0.72   // threshold — keep mid bars crisp, bloom only the brightest
  );
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
} catch (e) {
  composer = null;
  console.warn('Bloom unavailable, using direct render:', e);
}
function render() {
  if (composer) composer.render();
  else renderer.render(scene, camera);
}

// ---- Intro animation state (bars grow in, staggered left-to-right) ----
const bars = [];
let introT0 = null;
let introMaxWeek = 1;
const INTRO_MS = 1500;
const easeOut = t => 1 - Math.pow(1 - t, 3);

// ---- Data + geometry ----
const CELL = 1.0;      // footprint of each day
const GAP = 0.12;      // gap between cells
const STEP = CELL + GAP;
const MAX_HEIGHT = 13; // tallest bar (heights use a sqrt scale so busy days don't tower)
// Soft green glow per contribution level (0 = empty) — makes hotter cells read as lit.
const LEVEL_GLOW = [0, 0.34, 0.5, 0.68, 0.9];

function buildSkyline(contributions) {
  // Group by ISO week column so layout matches GitHub's calendar
  const days = contributions.map(d => ({
    ...d,
    dObj: new Date(d.date + 'T00:00:00Z')
  }));

  // week index relative to the first day's week
  const first = days[0].dObj;
  const firstWeekStart = new Date(first);
  firstWeekStart.setUTCDate(first.getUTCDate() - first.getUTCDay());

  const maxCount = Math.max(1, ...days.map(d => d.count));

  const baseGeo = new THREE.BoxGeometry(CELL, 1, CELL);
  baseGeo.translate(0, 0.5, 0); // grow upward from y=0

  const matCache = LEVEL_COLORS.map((c, i) => new THREE.MeshStandardMaterial({
    color: new THREE.Color(c),
    emissive: new THREE.Color(c),
    emissiveIntensity: LEVEL_GLOW[i],
    roughness: 0.45, metalness: 0.1
  }));

  let maxWeek = 0;
  days.forEach(d => {
    const w = Math.round((d.dObj - firstWeekStart) / (7 * 864e5));
    if (w > maxWeek) maxWeek = w;
  });

  const width = (maxWeek + 1) * STEP;
  const depth = 7 * STEP;

  days.forEach(d => {
    const weekIdx = Math.round((d.dObj - firstWeekStart) / (7 * 864e5));
    const dayIdx = d.dObj.getUTCDay();

    // A resting floor tile for empty days; otherwise a sqrt scale so a few very
    // busy days don't dwarf everything else — the range reads as a city skyline.
    const h = d.count === 0 ? 0.25 : 0.5 + Math.sqrt(d.count / maxCount) * MAX_HEIGHT;
    const mesh = new THREE.Mesh(baseGeo, matCache[d.level]);
    mesh.scale.y = 0.001;              // starts collapsed; grows in on load
    mesh.userData.h = h;               // target height for the intro animation
    mesh.userData.wx = weekIdx;        // for a left-to-right growth stagger
    mesh.position.set(
      weekIdx * STEP - width / 2 + STEP / 2,
      0,
      dayIdx * STEP - depth / 2 + STEP / 2
    );
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    world.add(mesh);
    bars.push(mesh);
  });

  introMaxWeek = maxWeek;
  introT0 = performance.now();

  // Ground plate
  const plate = new THREE.Mesh(
    new THREE.BoxGeometry(width + 4, 0.6, depth + 4),
    new THREE.MeshStandardMaterial({ color: '#161b22', roughness: 0.9 })
  );
  plate.position.y = -0.35;
  plate.receiveShadow = true;
  world.add(plate);

  controls.target.set(0, 3, 0);
  controls.update();
}

// ---- Load data ----
fetch(API)
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(data => {
    const contributions = data.contributions || [];
    if (!contributions.length) throw new Error('No contribution data returned.');
    const total = (data.total && (data.total.lastYear ?? Object.values(data.total)[0])) ??
      contributions.reduce((s, d) => s + d.count, 0);
    totalEl.textContent = total.toLocaleString();
    buildSkyline(contributions);
    statusEl.classList.add('hidden');
  })
  .catch(err => {
    statusEl.innerHTML =
      `<p>Couldn't load contribution data.<br><small style="color:#6e7681">${err.message}</small><br>` +
      `<a href="https://github.com/${USERNAME}">View GitHub profile →</a></p>`;
  });

// ---- Controls: buttons ----
const toggleBtn = document.getElementById('toggleRotate');
toggleBtn.addEventListener('click', () => {
  controls.autoRotate = !controls.autoRotate;
  toggleBtn.textContent = controls.autoRotate ? 'Pause rotation' : 'Resume rotation';
});
document.getElementById('resetView').addEventListener('click', () => {
  camera.position.set(38, 34, 46);
  controls.target.set(0, 3, 0);
  controls.update();
});

// ---- Render loop ----
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if (composer) composer.setSize(innerWidth, innerHeight);
});

function stepIntro() {
  if (introT0 === null) return;
  const elapsed = performance.now() - introT0;
  let done = true;
  for (const m of bars) {
    // each column starts a little after the one to its left
    const delay = (m.userData.wx / (introMaxWeek + 1)) * (INTRO_MS * 0.5);
    const t = Math.min(1, Math.max(0, (elapsed - delay) / (INTRO_MS * 0.6)));
    m.scale.y = Math.max(0.001, easeOut(t) * m.userData.h);
    if (t < 1) done = false;
  }
  if (done) introT0 = null;
}

(function animate() {
  requestAnimationFrame(animate);
  stepIntro();
  controls.update();
  render();
})();
</script>
</body>
</html>
