name: GitHub Profile 3D Contribution

on:
  # Rebuild once a day at 06:00 UTC
  schedule:
    - cron: "0 6 * * *"
  # Allow manual runs from the Actions tab (use this for the first render)
  workflow_dispatch:

# Required so the action can commit the generated SVGs back to the repo.
# NOTE: the repo must also have Settings -> Actions -> General ->
# Workflow permissions set to "Read and write permissions".
permissions:
  contents: write

# Only one render may push at a time. Without this, overlapping runs race on
# push and the loser fails. Queue rather than cancel so a run triggered
# mid-flight is not silently dropped.
concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned to its commit SHA
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Generate 3D contribution graph
        # github-profile-3d-contrib 0.7.1, pinned to its commit SHA so the tag
        # cannot be repointed at different code. Newer releases exist (v0.9.3);
        # upgrading is a separate, deliberate change.
        uses: yoshi389111/github-profile-3d-contrib@fd54cf20784ed9a86dc7be48bb5eb1f74e92b4f8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push generated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./profile-3d-contrib
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update 3D contribution graph [skip ci]"
            git push
          fi
